name: LlatserListen
options:
  bundleIdPrefix: com.llatser
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.14.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"

targets:
  LlatserListen:
    type: application
    platform: macOS
    sources:
      # Everything except the Core ML package (added explicitly below so
      # xcodegen doesn't recurse into the .mlpackage as loose resources).
      - path: LlatserListen
        excludes:
          - "Resources/Bouncer/Bouncer.mlpackage"
      # The Bouncer model: a compile source so Xcode's Core ML compiler emits
      # Bouncer.mlmodelc into the app bundle. vocab.txt / threshold.json /
      # labels.json under Resources/Bouncer are picked up as resources by the
      # glob above.
      - path: LlatserListen/Resources/Bouncer/Bouncer.mlpackage
        type: file
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llatser.listen
        PRODUCT_NAME: "Beers"
        MARKETING_VERSION: "1.2.0"
        # Sparkle compares this monotonically increasing build number.
        # Bump it with every public release (1.2.0 -> 120, 1.3.0 -> 130).
        CURRENT_PROJECT_VERSION: "120"
        INFOPLIST_FILE: LlatserListen/Info.plist
        CODE_SIGN_ENTITLEMENTS: LlatserListen/LlatserListen.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Public releases support Apple Silicon only. Do not add x86_64 until
        # the complete FluidAudio/Parakeet runtime has passed on physical Intel.
        ARCHS: arm64
        # We load Bouncer.mlmodelc by hand (Bouncer.swift), so skip Core ML's
        # auto-generated model class — it would collide with our Bouncer type.
        COREML_CODEGEN_LANGUAGE: "None"
    dependencies:
      - package: FluidAudio
      - package: Sparkle
    entitlements:
      path: LlatserListen/LlatserListen.entitlements
      properties:
        com.apple.security.device.audio-input: true
