name: Feature request
description: Propose a focused improvement to Beers.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behaviour you want without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add relevant workflow, privacy, accessibility or performance constraints.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This request does not include real dictation text, names, client details or credentials.
          required: true
