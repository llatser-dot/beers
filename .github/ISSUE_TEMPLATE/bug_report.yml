name: Bug report
description: Report a reproducible problem in the latest Beers release.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private dictation text, names and credentials from every field and attachment.
  - type: input
    id: version
    attributes:
      label: Beers version
      placeholder: "1.3.2"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: "MacBook Pro M3, macOS 15.5"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the shortest reliable sequence of steps.
      placeholder: |
        1. Open …
        2. Hold …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence
      description: Add relevant logs or screenshots after removing private text.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real dictations, names, client details and credentials.
          required: true
