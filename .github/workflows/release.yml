# Signed, notarized release on a v* tag push.
#
# Required repository secrets:
#   DEVELOPER_ID_CERT_P12      base64 of a .p12 export of the Developer ID
#                              Application cert *and* its private key
#   DEVELOPER_ID_CERT_PASSWORD the password used for that .p12 export
#   SPARKLE_ED_PRIVATE_KEY     the Sparkle EdDSA private key, as printed by
#                              `generate_keys -x - --account com.llatser.listen`
#   ASC_API_KEY_P8             base64 of the App Store Connect .p8 API key
#   ASC_API_KEY_ID             the key's ID
#   ASC_API_ISSUER_ID          the issuer UUID
#
# The repo is PUBLIC. All five must be Actions secrets — never committed, and
# never echoed into the log.
#
# The final step pushes appcast.xml to main, and that push is what actually
# ships the update to users. Everything before it only builds the artifact.

name: Release (signed + notarized)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.3.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: 2.44.1
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
      TEAM_ID: 6U9UFUUR48
      SPARKLE_KEY_ACCOUNT: com.llatser.listen

    steps:
      - name: Check out source and LFS objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          lfs: true

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          short="${tag#v}"
          # project.yml is the source of truth; the tag must agree with it or we
          # would ship a build whose Sparkle version does not match its release.
          marketing="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)"
          build="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\(.*\)"/\1/p' project.yml)"
          if [ "$short" != "$marketing" ]; then
            echo "Tag $tag disagrees with MARKETING_VERSION $marketing" >&2
            exit 1
          fi
          echo "tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "short=$short"       >> "$GITHUB_OUTPUT"
          echo "build=$build"       >> "$GITHUB_OUTPUT"

      - name: Fail if this build number already shipped
        shell: bash
        run: |
          set -euo pipefail
          # Sparkle compares build numbers. Reusing one means existing installs
          # never see the update, which is the exact failure this workflow exists
          # to prevent — so catch it here rather than after publishing.
          if grep -q "<sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>" appcast.xml; then
            echo "Build ${{ steps.version.outputs.build }} is already in appcast.xml" >&2
            exit 1
          fi

      - name: Run the release readiness gate
        run: ./scripts/release-check.sh

      - name: Import the Developer ID signing certificate
        shell: bash
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          # Ephemeral, random password: the keychain dies with the runner.
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/cert.p12"

          printf '%s' "$CERT_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive keychain prompt that
          # no one can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"

      - name: Archive and export
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>developer-id</string>
              <key>teamID</key><string>$TEAM_ID</string>
              <key>signingStyle</key><string>manual</string>
              <key>signingCertificate</key><string>Developer ID Application: Benjamin Restall ($TEAM_ID)</string>
              <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          # archive + exportArchive, NOT the plain `build` action: `build` injects
          # com.apple.security.get-task-allow and leaves the nested Sparkle
          # binaries on their upstream signatures. Both are notarization-fatal,
          # and both pass `codesign --verify --deep --strict`.
          xcodebuild -project Beers.xcodeproj -scheme Beers -configuration Release \
            -archivePath "$RUNNER_TEMP/Beers.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Beers.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify the signature before notarizing
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Beers.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q "^Timestamp="
          # The two failures that cost a release cycle on 1.3.2. Checked here so
          # they fail in seconds rather than after a notarization round-trip.
          test "$(codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -c get-task-allow)" -eq 0
          for b in Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate \
                   Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app; do
            codesign -dv --verbose=2 "$app/$b" 2>&1 | grep -q "^Authority=Developer ID Application"
            codesign -dv --verbose=2 "$app/$b" 2>&1 | grep -q "^Timestamp="
          done

      - name: Notarize and staple
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Beers.app"
          key="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$key"

          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --timeout 45m
          rm -f "$key" "$RUNNER_TEMP/notarize.zip"

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app" 2>&1 | grep -q "source=Notarized Developer ID"

      - name: Package the stapled app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Beers.app"
          zip="$RUNNER_TEMP/Beers-${{ steps.version.outputs.short }}.app.zip"
          # Zipped AFTER stapling: the ticket changes the app's bytes, so a zip
          # made before this point would fail Sparkle's signature check on every
          # user's machine.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -f%z "$zip")" >> "$GITHUB_OUTPUT"

      - name: Sign the archive for Sparkle
        id: sparkle
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sign_update="$(find ~/Library/Developer/Xcode/DerivedData \
            "$RUNNER_TEMP/Beers.xcarchive" -name sign_update -type f -perm -u+x 2>/dev/null | head -1)"
          test -n "$sign_update" || { echo "sign_update not found" >&2; exit 1; }

          key="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          signature="$("$sign_update" --ed-key-file "$key" -p "${{ steps.package.outputs.zip }}")"
          rm -f "$key"
          test -n "$signature" || { echo "empty signature" >&2; exit 1; }
          echo "::add-mask::$signature"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Upload before the appcast points at it. The reverse order leaves a
          # window where every user who checks gets a 404 download.
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.zip }}" \
            --title "Beers ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Update the appcast — this is what ships the update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-appcast.py \
            --version "${{ steps.version.outputs.build }}" \
            --short-version "${{ steps.version.outputs.short }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --signature "${{ steps.sparkle.outputs.signature }}" \
            --length "${{ steps.package.outputs.length }}" \
            --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Publish ${{ steps.version.outputs.tag }} to the appcast"
          # Push to main, not the tag: SUFeedURL reads raw main. Users see this
          # within ~5 minutes, once the raw.githubusercontent cache expires.
          git push origin HEAD:main
