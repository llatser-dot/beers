name: Send work evidence to Dweeb

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  send-work-evidence:
    if: ${{ !contains(github.event.head_commit.message, '[skip dweeb]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send signed push evidence
        shell: bash
        env:
          DWEEB_INGEST_URL: https://dweeb-work-ledger.llatser.chatgpt.site/api/ingest/github
        run: |
          set -euo pipefail
          encoded_audience="$(printf '%s' "$DWEEB_INGEST_URL" | jq -sRr @uri)"
          identity="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" | jq -r .value)"
          test -n "$identity"
          echo "::add-mask::$identity"
          curl --fail --silent --show-error \
            -X POST "$DWEEB_INGEST_URL" \
            -H "authorization: Bearer $identity" \
            -H "content-type: application/json" \
            --data-binary "@$GITHUB_EVENT_PATH"
